# Builds "Notch Island.app" on GitHub's macOS runner and attaches a zip to a
# GitHub Release whenever a version tag (v0.2.0, v1.0.0, …) is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent "Notch Island.app" NotchIsland.zip
          shasum -a 256 NotchIsland.zip | tee NotchIsland.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/NotchIsland.zip build/NotchIsland.zip.sha256 \
            --title "Notch Island $GITHUB_REF_NAME" --generate-notes

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland
          path: build/NotchIsland.zip
